<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R&J Resells</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link href="https://fonts.cdnfonts.com/css/cloister-black" rel="stylesheet">
  
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#070707;
--card:#111111;
--gold:#89CFF0;
--white:#ffffff;
--gray:#b8b8b8;
}

body{
font-family:Arial,sans-serif;
background:
linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.88)),
url('background.jpg') no-repeat center center fixed;
background-size:cover;
color:var(--white);
overflow-x:hidden;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:18px 40px;
display:flex;
justify-content:center;
gap:40px;
background:rgba(8,8,8,.72);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
z-index:9999;
}

nav a{
color:#89CFF0;
text-decoration:none;
font-size:13px;
font-weight:bold;
letter-spacing:1px;
text-transform:uppercase;
transition:.25s;  
}

nav a:hover{
color:var(--gold);
}

header{
padding-top:170px;
padding-bottom:80px;
text-align:center;
max-width:900px;
margin:auto;
}

header h1{
font-size:88px;
font-weight:normal;
letter-spacing:2px;
margin-bottom:18px;
text-transform:none;
color:#89CFF0;
text-shadow:0 0 25px rgba(137,207,240,.18);
font-family:'Cloister Black',
